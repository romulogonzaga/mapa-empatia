<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Empatia Completo - Inovação SENAI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .header { text-align: center; max-width: 800px; margin-bottom: 20px; }
        .header h1 { color: #0056b3; margin-bottom: 5px; }
        .header p { color: #666; font-size: 0.9rem; }

        /* Container Principal do Print */
        #mapa-captura {
            width: 850px;
            background: white;
            padding: 25px;
            border: 2px solid #ddd;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Grade Superior (4 Quadrantes) */
        .grid-superior {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 250px 250px;
            gap: 10px;
            position: relative;
        }

        /* Divisória em Cruz no Meio dos Quadrantes */
        .grid-superior::before { content: ""; position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: #f0f0f0; z-index: 1; }
        .grid-superior::after { content: ""; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: #f0f0f0; z-index: 1; }

        /* Grade Inferior (Dores e Ganhos) */
        .grid-inferior {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            border-top: 3px solid #ffca28;
            padding-top: 15px;
        }

        .quadrante { padding: 15px; display: flex; flex-direction: column; z-index: 2; border-radius: 8px; border: 1px solid #f9f9f9; }
        .quadrante label { font-weight: bold; color: #333; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
        
        /* Cores de fundo sutis para diferenciar áreas */
        .q-empatia { background-color: #ffffff; }
        .q-dor { background-color: #fff5f5; border: 1px solid #feb2b2; }
        .q-ganho { background-color: #f0fff4; border: 1px solid #9ae6b4; }

        textarea { flex-grow: 1; border: 1px solid #eee; background: #fdfdfd; padding: 10px; resize: none; font-size: 13px; color: #444; border-radius: 5px; font-family: inherit; }
        textarea:focus { background: #fff; outline: 1px solid #0056b3; border-color: transparent; }

        /* Persona Central */
        .persona-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffca28;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            border: 5px solid white;
            font-weight: bold;
            font-size: 11px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-container { margin-top: 30px; display: flex; gap: 15px; }
        .btn { padding: 15px 40px; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-save { background: #27ae60; color: white; }
        .btn-save:hover { background: #219150; transform: translateY(-2px); }
        
        .footer-tag { margin-top: 15px; font-size: 11px; color: #bbb; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Gerador de Mapa de Empatia</h1>
        <p>Complete a imersão no seu usuário.</p>
    </div>

    <div id="mapa-captura">
        
        <div class="grid-superior">
            <div class="persona-center">USUÁRIO</div>

            <div class="quadrante q-empatia">
                <label>💭 O que PENSA e SENTE?</label>
                <textarea placeholder="O que passa na cabeça dele? Quais são suas maiores preocupações e sonhos?"></textarea>
            </div>

            <div class="quadrante q-empatia">
                <label>👁️ O que VÊ?</label>
                <textarea placeholder="Como é o ambiente onde ele vive? O que os amigos fazem? O que ele vê na internet?"></textarea>
            </div>

            <div class="quadrante q-empatia">
                <label>👂 O que OUVE?</label>
                <textarea placeholder="Quem o influencia? O que os colegas e família dizem sobre o problema?"></textarea>
            </div>

            <div class="quadrante q-empatia">
                <label>🗣️ O que DIZ e FAZ?</label>
                <textarea placeholder="Como ele se comporta em público? O que ele costuma dizer para as pessoas?"></textarea>
            </div>
        </div>

        <div class="grid-inferior">
            <div class="quadrante q-dor">
                <label>😫 DORES (Obstáculos)</label>
                <textarea placeholder="Do que ele tem medo? O que o frustra hoje? Quais são as barreiras para ele?"></textarea>
            </div>

            <div class="quadrante q-ganho">
                <label>🏆 GANHOS (Desejos)</label>
                <textarea placeholder="O que ele quer alcançar? Qual é a medida de sucesso dele? O que facilitaria sua vida?"></textarea>
            </div>
        </div>

    </div>

    <div class="btn-container">
        <button class="btn btn-save" onclick="baixarMapa()">💾 Baixar Mapa Completo (PNG)</button>
    </div>

    <div class="footer-tag">Professor Rômulo Gonzaga -2026</div>

    <script>
        function baixarMapa() {
            const container = document.getElementById("mapa-captura");
            const btn = document.querySelector(".btn-save");
            btn.innerText = "Gerando imagem...";
            
            html2canvas(container, {
                backgroundColor: "#ffffff",
                scale: 2 
            }).then(canvas => {
                const link = document.createElement("a");
                link.download = "mapa-empatia-completo-senai.png";
                link.href = canvas.toDataURL("image/png");
                link.click();
                btn.innerText = "💾 Baixar Mapa Completo (PNG)";
            });
        }
    </script>

</body>
</html>
